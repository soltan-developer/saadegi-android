name: Android checks
on:
  pull_request:
    paths:
      - "app/**"
      - "**/*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: "false"
      - name: SDK platform and tools
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Unit tests and debug assemble
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
