name: Android checks
on:
  pull_request:
    paths:
      - "app/**"
      - "**/*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: "false"
      - name: SDK platform and tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - name: Pin and stage libXray Android native binary
        run: bash scripts/prepare-libxray.sh
      - name: Unit tests and debug assemble
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Inspect APK size and packaged native ABIs
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          echo "APK_BYTES=$(stat -c%s "$apk")"
          echo "APK_MIB=$(du -m "$apk" | cut -f1)"
          echo "Native libraries in APK:"
          unzip -Z1 "$apk" | grep "^lib/" | cut -d/ -f2 | sort -u
          count=$(unzip -Z1 "$apk" | grep "^lib/" | cut -d/ -f2 | sort -u | wc -l)
          test "$count" -eq 1
          unzip -Z1 "$apk" | grep -q "^lib/arm64-v8a/"
          echo "This is an INTERNAL native tunnel trial, not a production VPN release."
      - name: Store arm64 internal VPN test APK
        uses: actions/upload-artifact@v4
        with:
          name: saadegi-android-arm64-internal
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
